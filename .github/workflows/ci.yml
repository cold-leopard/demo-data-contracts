on:
  pull_request:
    branches:
    - 'main'
  push:
    branches:
    - 'main'

jobs:
  build:
    name: Code
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: Build Project
      run: dotnet build src
    - name: Run .NET tests
      run: dotnet test test --logger "trx" --results-directory "test-results" --collect:"Code Coverage"
      continue-on-error: true
    - name: Archive test results
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: test-results/*.trx
    - name: Gather Coverage Results    
      run: dotnet tool exec dotnet-coverage merge --output test-result.cobertura.xml --output-format cobertura "test-results/**/*.coverage"
    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: "test-result.cobertura.xml"

  docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: DocFx Build Validation
      run: dotnet tool exec docfx docs/docfx.json
      
  test_reports:
    name: Display Test Reports
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Download test report
      uses: actions/download-artifact@v5
      with:
        name: test-report
    - name: Download coverage report
      uses: actions/download-artifact@v5
      with:
        name: coverage-report
    - name: Create Coverage Report
      run: dotnet tool exec dotnet-reportgenerator-globaltool -reports:"test-result.cobertura.xml" -targetdir:"coverage-report" -reporttypes:MarkdownSummaryGithub
    - name: Report Test Results 
      id: test-report
      uses: dorny/test-reporter@v3
      with:
        name: DotNet Tests
        path: ./*.trx
        reporter: dotnet-trx 
    - name: Add Test Results PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: ${{ steps.test-report.outputs.summary_file }}
    - name: Report Coverage Results
      run: cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: coverage-report/SummaryGithub.md
